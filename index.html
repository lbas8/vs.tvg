<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portale Verbali di Sopralluogo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-6">
  <div class="max-w-4xl mx-auto">
    <header class="bg-slate-900 text-white p-6 rounded-xl shadow-md mb-6 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold">Portale Verbali Ambientali</h1>
        <p class="text-xs text-slate-400">Archivio e Gestione Sopralluoghi</p>
      </div>
      <a href="verbale.html" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded text-sm font-medium flex items-center gap-2">
        <i class="fa-solid fa-plus"></i> Nuovo Verbale
      </a>
    </header>

    <div class="bg-white rounded-xl shadow-md p-6 border border-slate-200">
      <h2 class="text-md font-bold text-slate-800 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-folder-open text-emerald-600"></i> Verbali Archiviati in Cloud
      </h2>
      <div id="verbali-list" class="space-y-2">
        <p class="text-xs text-slate-500">Caricamento elenco in corso...</p>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://console.firebase.google.com/project/vstvg-1f2f6/database/vstvg-1f2f6-default-rtdb/data/~2F"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref('verbali').on('value', (snapshot) => {
      const container = document.getElementById('verbali-list');
      container.innerHTML = '';
      const data = snapshot.val();
      
      if (!data) {
        container.innerHTML = '<p class="text-xs text-slate-500">Nessun verbale presente nel cloud.</p>';
        return;
      }

      Object.keys(data).forEach(key => {
        const item = data[key];
        const dateStr = item.datetime ? new Date(item.datetime).toLocaleString() : 'Data non specificata';
        
        const div = document.createElement('div');
        div.className = "flex justify-between items-center p-3 bg-slate-50 border border-slate-200 rounded hover:bg-slate-100 transition";
        div.innerHTML = `
          <div>
            <div class="font-bold text-sm text-slate-800">${key}</div>
            <div class="text-xs text-slate-500">Cantiere: ${item.cantiere || 'N.D.'} | Area: ${item.area || 'N.D.'} | Data: ${dateStr}</div>
          </div>
          <a href="verbale.html?load=${encodeURIComponent(key)}" class="bg-sky-600 hover:bg-sky-500 text-white px-3 py-1.5 rounded text-xs">
            <i class="fa-solid fa-eye"></i> Apri / Modifica
          </a>
        `;
        container.appendChild(div);
      });
    });
  </script>
</body>
</html>
